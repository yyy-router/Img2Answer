[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "img2answer"
version = "0.1.0"
description = "Local PDF question extraction and image-search preparation tools."
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10",
  "PyMuPDF>=1.24",
  "PyYAML>=6",
]

[project.optional-dependencies]
vector = [
  "chromadb>=0.5",
]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1",
]
openclip = [
  "open_clip_torch>=2.24",
  "torch>=2",
  "torchvision>=0.17",
]

[project.scripts]
img2answer-poc = "img2answer.cli:main"
img2answer-api = "img2answer.api:run"

[tool.setuptools.packages.find]
where = ["src"]

